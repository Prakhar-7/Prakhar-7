<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Prakhar Srivastava, Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cur  { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="960" cy="50" r="180" fill="#7C3AED" opacity="0.55" filter="url(#blur)"/>
    <circle cx="1130" cy="300" r="150" fill="#0EA5E9" opacity="0.45" filter="url(#blur)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <text x="72" y="96" class="mono" font-size="18" fill="#94A3B8">$ whoami<tspan class="cur" fill="#A78BFA"> ▍</tspan></text>
    <text x="70" y="172" class="sans" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Prakhar Srivastava</text>
    <text x="72" y="218" class="sans" font-size="24" font-weight="600" fill="url(#ink)">Full-Stack Engineer · AI &amp; Voice Systems · Cloud</text>
    <text x="72" y="258" class="sans" font-size="17" fill="#94A3B8">I build AI-powered products end to end, from the interface to the infrastructure.</text>
  </g>
</svg>
