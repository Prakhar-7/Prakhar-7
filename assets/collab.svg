<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Collaboration. Let's build something useful. Engineering roles shipping AI-powered products end to end, research and side projects in real-time voice AI, LLM pipelines and agentic systems, and conversations on latency, deterministic AI and production-grade cloud infrastructure.">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .sans    { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.5px; fill: #C2410C; }
      .h       { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; fill: #1C1917; }
      .b       { font-size: 19px; fill: #44403C; }
      .hl      { font-weight: 700; fill: #C2410C; }

      .card { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

      .tape { transform-box: fill-box; transform-origin: center; animation: stick 0.5s ease-out both; }
      .t1 { animation-delay: 0.7s; }
      .t2 { animation-delay: 0.85s; }
      @keyframes stick { from { opacity: 0; transform: scale(1.35); } to { opacity: 1; transform: scale(1); } }

      .ring { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(3); opacity: 0; } }

      .u { fill: none; stroke: #C2410C; stroke-width: 3.5; stroke-linecap: round;
           stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 6s ease-in-out 1.2s infinite both; }
      @keyframes draw {
        0%   { stroke-dashoffset: 1; opacity: 1; }
        15%  { stroke-dashoffset: 0; }
        85%  { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }

      .row { animation: fadeUp 0.6s ease-out both; }
      .r1 { animation-delay: 1.0s; }
      .r2 { animation-delay: 1.15s; }
      .r3 { animation-delay: 1.3s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      @media (prefers-reduced-motion: reduce) {
        .card, .tape, .ring, .u, .row { animation: none; }
        .u { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g class="card">
    <g transform="rotate(-0.5 600 206)">
      <rect x="60" y="56" width="1080" height="300" rx="8" fill="#FBF5E6" stroke="#EADFC6" filter="url(#shadow)"/>

      <!-- Eyebrow -->
      <rect x="108" y="92" width="196" height="30" rx="15" fill="#C2410C" fill-opacity="0.1" stroke="#C2410C" stroke-opacity="0.35"/>
      <circle class="ring" cx="126" cy="107" r="4" fill="none" stroke="#C2410C" stroke-width="2"/>
      <circle cx="126" cy="107" r="4" fill="#C2410C"/>
      <text class="sans eyebrow" x="140" y="112">COLLABORATION</text>

      <!-- Headline -->
      <text class="sans h" x="108" y="170" textLength="342" lengthAdjust="spacing">Let&#8217;s build something</text>
      <text class="sans h" x="459" y="170" textLength="106" lengthAdjust="spacing">useful.</text>
      <path class="u" pathLength="1" d="M459 181 Q483 187 507 183 T556 182"/>

      <line x1="108" y1="204" x2="1092" y2="204" stroke="#CDBB94" stroke-width="1.5" stroke-dasharray="7 7"/>

      <!-- Lines -->
      <g class="row r1">
        <circle cx="118" cy="240" r="4.5" fill="#C2410C"/>
        <text class="sans b" x="136" y="246">Engineering roles shipping <tspan class="hl">AI-powered products</tspan> end to end, from interface to infrastructure</text>
      </g>
      <g class="row r2">
        <circle cx="118" cy="278" r="4.5" fill="#C2410C"/>
        <text class="sans b" x="136" y="284">Research and side projects in <tspan class="hl">real-time voice AI</tspan>, <tspan class="hl">LLM pipelines</tspan> and <tspan class="hl">agentic systems</tspan></text>
      </g>
      <g class="row r3">
        <circle cx="118" cy="316" r="4.5" fill="#C2410C"/>
        <text class="sans b" x="136" y="322">Conversations on <tspan class="hl">latency</tspan>, <tspan class="hl">deterministic AI</tspan> and production-grade <tspan class="hl">cloud infrastructure</tspan></text>
      </g>
    </g>
  </g>

  <g class="tape t1"><rect x="22" y="46" width="150" height="38" fill="#E9B872" fill-opacity="0.8" transform="rotate(-35 97 65)"/></g>
  <g class="tape t2"><rect x="1028" y="46" width="150" height="38" fill="#E9B872" fill-opacity="0.8" transform="rotate(35 1103 65)"/></g>
</svg>
