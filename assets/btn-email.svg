<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 56" width="176" height="56" role="img" aria-label="Email me">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9541A"/>
      <stop offset="1" stop-color="#B83A0A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="2" y="2" width="172" height="52" rx="14"/></clipPath>
    <style>
      .t { font: 600 18px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .s { animation: sweep 3.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-90px); } 40%, 100% { transform: translateX(240px); } }
      @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect x="2" y="2" width="172" height="52" rx="14" fill="url(#fill)"/>
  <g clip-path="url(#clip)">
    <g class="s"><rect x="0" y="-10" width="50" height="76" fill="url(#shine)" transform="skewX(-20)"/></g>
  </g>
  <rect x="24" y="19" width="26" height="18" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M25 21 L37 30 L49 21" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="62" y="34">Email me</text>
</svg>
