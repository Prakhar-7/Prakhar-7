<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="36% faster first reply, 2,494 resume reviews, 14,646 interview sessions, 6+ freelance projects">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      .num { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 800; letter-spacing: -1px; }
      .lbl { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Card 1 -->
  <rect x="1" y="1" width="274" height="158" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="24" y="1" width="228" height="3" rx="1.5" fill="url(#ink)"/>
  <text x="138" y="74" text-anchor="middle" class="num" fill="url(#ink)">36%</text>
  <text x="138" y="108" text-anchor="middle" class="lbl">faster first reply in a</text>
  <text x="138" y="130" text-anchor="middle" class="lbl">real-time voice AI tutor</text>

  <!-- Card 2 -->
  <rect x="309" y="1" width="274" height="158" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="332" y="1" width="228" height="3" rx="1.5" fill="url(#ink)"/>
  <text x="446" y="74" text-anchor="middle" class="num" fill="url(#ink)">2,500+</text>
  <text x="446" y="108" text-anchor="middle" class="lbl">resume reviews processed</text>
  <text x="446" y="130" text-anchor="middle" class="lbl">by an LLM service I built</text>

  <!-- Card 3 -->
  <rect x="617" y="1" width="274" height="158" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="640" y="1" width="228" height="3" rx="1.5" fill="url(#ink)"/>
  <text x="754" y="74" text-anchor="middle" class="num" fill="url(#ink)">14,000+</text>
  <text x="754" y="108" text-anchor="middle" class="lbl">sessions on a production</text>
  <text x="754" y="130" text-anchor="middle" class="lbl">AI interview platform</text>

  <!-- Card 4 -->
  <rect x="925" y="1" width="274" height="158" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="948" y="1" width="228" height="3" rx="1.5" fill="url(#ink)"/>
  <text x="1062" y="74" text-anchor="middle" class="num" fill="url(#ink)">6+</text>
  <text x="1062" y="108" text-anchor="middle" class="lbl">freelance projects</text>
  <text x="1062" y="130" text-anchor="middle" class="lbl">shipped end to end</text>
</svg>
